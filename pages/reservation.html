<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Reservation</title>
    <!-- Link to CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/reservation.css">
</head>
<body>
    <!-- Navigation Bar -->
    <header class="bg-dark py-3 border-bottom">
        <div class="container d-flex justify-content-between align-items-center">

            <!-- Logo -->
            <img src="/images/starlight-logo.png" alt="Logo" width="70">

            <!-- Links -->
            <ul class="nav">
                <li><a href="/index.html" class="nav-link text-white">Home</a></li>
                <li><a href="/pages/menu.html" class="nav-link text-white">Menu</a></li>
                <li><a href="/pages/reservation.html" class="nav-link text-white">Book Reservation</a></li>
                <li><a href="/pages/reviews.html" class="nav-link text-white">Reviews</a></li>
                <li><a href="/pages/aboutus.html" class="nav-link text-white">About Us</a></li>
            </ul>

            <!-- Search -->
            <input type="text" class="form-control w-auto" placeholder="Search...">
        </div>
    </header>    

    <!-- Layout for Booking Details & Your Information-->
    <div class="container mt-5">

        <form>
        <div class="row">
            <!-- Booking Details -->
            <div class="col-md-5 mx-auto">
                <div class="border rounded p-4 bg-dark">
                    <h4 class="text-center mb-5">Booking Details</h4>
                    
                    <!-- Event Date -->
                    <div class="mb-4 row">
                        <label class="col-sm-4 col-form-label">Event Date</label>
                        <div class="col-sm-8">
                            <input type="date" class="form-control">
                        </div>
                    </div>

                    <!-- Time Slot -->
                    <div class="mb-4 row">
                        <label class="col-sm-4 col-form-label">Time Slot</label>
                        <div class="col-sm-8">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="time">
                                <label class="form-check-label" for="defaultCheck1">Morning (10AM - 1PM)</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="time">
                                <label class="form-check-label">Afternoon (2PM - 6PM)</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="time">
                                <label class="form-check-label">Evening (7PM - 10PM)</label>
                            </div>
                        </div>
                    </div>

                    <!-- Number of Tickets-->
                    <div class="mb-4 row">
                        <label class="col-sm-4 col-form-label">Number of Tickets</label>
                        <div class="col-sm-8">
                            <input type="number" class="form-control" name="tickets" min="1" placeholder="Enter number">
                        </div>
                    </div>

                    <!-- Special Requests -->
                    <div class="mb-4 row">
                        <label class="col-sm-4 col-form-label">Special Requests</label>
                        <div class="col-sm-8">
                            <textarea class="form-control" rows="3" placeholder="Optional"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Your Information -->
            <div class="col-md-5 mx-auto">
                <div class="border rounded p-4 bg-dark">
                    <h4 class="text-center mb-5">Your Information</h4>

                    <div class="mb-4 row">
                        <label class="col-sm-4 col-form-label">First Name</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control">
                        </div>
                    </div>
                    <div class="mb-4 row">
                        <label class="col-sm-4 col-form-label">Last Name</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control">
                        </div>
                    </div>
                    <div class="mb-4 row">
                        <label class="col-sm-4 col-form-label">Email Address</label>
                        <div class="col-sm-8">
                            <input type="email" class="form-control">
                        </div>
                    </div>
                    <div class="mb-4 row">
                        <label class="col-sm-4 col-form-label">Phone Number</label>
                        <div class="col-sm-8">
                            <input type="tel" class="form-control">
                        </div>
                    </div>

                </div>
            </div>
        </div>
        </form>
    </div>    

    <footer class="bg-dark text-light py-4 my-5"> 
        <ul class="nav justify-content-center border-bottom pb-3 mb-3"> 
            <li class="nav-item"><a href="/index.html" class="nav-link px-2 text-white">Home</a></li> 
            <li class="nav-item"><a href="/pages/menu.html" class="nav-link px-2 text-white">Menu</a></li> 
            <li class="nav-item"><a href="/pages/reservation.html" class="nav-link px-2 text-white">Book Reservation</a></li> 
            <li class="nav-item"><a href="/pages/reviews.html" class="nav-link px-2 text-white">Reviews</a></li> 
            <li class="nav-item"><a href="/pages/aboutus.html" class="nav-link px-2 text-white">About Us</a></li> 
        </ul> 

        <div class="container text-center mb-3">
            <div class="row">
                <div class="col-md-4">
                    <p>123 Bowling Lane</p>
                </div>
                <div class="col-md-4">
                    <p> City, State 12345</p>
                </div>
                <div class="col-md-4">
                    <p>Phone: (123) 456-7890</p>
                </div>
            </div>
        </div>
        <p class="text-center text-white">© 2025 Bowling Alley. All rights reserved.</p> 
    </footer>
</body>
</html>
